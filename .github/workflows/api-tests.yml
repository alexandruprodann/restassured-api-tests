name: API Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rest-assured-tests:
    name: Rest Assured Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      API_KEY: ${{ secrets.API_KEY }}
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      BASE_URI: https://reqres.in
      BASE_PATH: /api
      REQRES_ENV: prod
      USER_AGENT: restassured-api-tests/github-actions
      REQUEST_DELAY_MS: 500

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify required secrets
        run: |
          missing=0
          for name in API_KEY LOGIN_EMAIL LOGIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret for $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run API tests
        run: bash ./mvnw -B test
